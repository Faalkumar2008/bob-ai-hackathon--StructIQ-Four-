project:
  name: "ARIA — Bridge Health Monitoring & Predictive Maintenance Assistant"
  short_name: "ARIA Bridge Health Monitor"
  version: "1.0.0"
  date_submitted: "2026-09-15"

team:
  name: "StructIQ Four"
  members:
    - name: "Faalkumar Patel"
      role: "Team Lead & AI Architect"
      built: "IBM Bob custom mode (ARIA persona), skill design, project vision, full Bob integration"
    - name: "Tirth Patel"
      role: "Backend Engineer"
      built: "MCP server (TypeScript), 9 tools, sensor models, predictive RUL algorithms"
    - name: "Shubham Patel"
      role: "Frontend Engineer"
